<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:332px;height:1015px;background:#FAFAF8;" width="332px" height="1015px" viewBox="0 0 332 1015" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="332" height="1015" fill="#FAFAF8" style="stroke:none;"/><g class="title" data-source-line="1"><text x="30.035" y="34.813" fill="#000" font-size="14" textLength="269.931" font-weight="700" font-family="Microsoft YaHei">AG Switch Pro 阶段进度（2026-10-14）</text></g><ellipse cx="164" cy="64.478" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="36.177" y="94.478" width="255.646" height="51.676" fill="#E7F4EB" style="stroke:#367A49;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="46.177" y="117.175" fill="#173521" font-size="12" textLength="48" font-family="Microsoft YaHei">方案确认</text><text x="46.177" y="133.013" fill="#173521" font-size="12" textLength="235.646" font-family="Microsoft YaHei">cc-switch 为基础，magpie 意图路由为参考</text><rect x="23.673" y="166.153" width="280.654" height="51.676" fill="#E7F4EB" style="stroke:#367A49;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="33.673" y="188.851" fill="#173521" font-size="12" textLength="84" font-family="Microsoft YaHei">项目与便携环境</text><text x="33.673" y="204.688" fill="#173521" font-size="12" textLength="260.654" font-family="Microsoft YaHei">Rust / MinGW / 缓存位于项目内，不修改 PATH</text><rect x="16" y="237.829" width="296" height="51.676" fill="#E7F4EB" style="stroke:#367A49;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="260.526" fill="#173521" font-size="12" textLength="48" font-family="Microsoft YaHei">路由核心</text><text x="26" y="276.364" fill="#173521" font-size="12" textLength="276" font-family="Microsoft YaHei">阶段复用、预算、能力过滤、失败冷却、状态连续性</text><rect x="16" y="309.505" width="296" height="51.676" fill="#E7F4EB" style="stroke:#367A49;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="332.202" fill="#173521" font-size="12" textLength="84" font-family="Microsoft YaHei">桌面与代理接入</text><text x="26" y="348.04" fill="#173521" font-size="12" textLength="276" font-family="Microsoft YaHei">配置页面、虚拟模型目录、判断费用、实际模型记录</text><rect x="18.818" y="381.181" width="290.363" height="51.676" fill="#E7F4EB" style="stroke:#367A49;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="28.818" y="403.878" fill="#173521" font-size="12" textLength="48" font-family="Microsoft YaHei">本地验证</text><text x="28.818" y="419.716" fill="#173521" font-size="12" textLength="270.363" font-family="Microsoft YaHei">前端 2525/2525，核心 24 项，既有转发器 128 项</text><rect x="46" y="452.856" width="236" height="51.676" fill="#E7F4EB" style="stroke:#367A49;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="56" y="475.554" fill="#173521" font-size="12" textLength="108" font-family="Microsoft YaHei">桌面打包与运行检查</text><text x="56" y="491.392" fill="#173521" font-size="12" textLength="216" font-family="Microsoft YaHei">构建通过，静默启动并初始化隔离数据库</text><rect x="61.894" y="524.532" width="204.213" height="51.676" fill="#E7F4EB" style="stroke:#367A49;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="71.894" y="547.229" fill="#173521" font-size="12" textLength="72" font-family="Microsoft YaHei">回退冷却回归</text><text x="71.894" y="563.067" fill="#173521" font-size="12" textLength="184.213" font-family="Microsoft YaHei">已修复并通过，相关后端共 142 项</text><rect x="52" y="596.208" width="224" height="51.676" fill="#E7F4EB" style="stroke:#367A49;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="62" y="618.905" fill="#173521" font-size="12" textLength="109.898" font-family="Microsoft YaHei">最新 EXE 与便携 ZIP</text><text x="62" y="634.743" fill="#173521" font-size="12" textLength="204" font-family="Microsoft YaHei">已重建，内置前端，无额外控制台窗口</text><rect x="64" y="667.884" width="200" height="51.676" fill="#FFF1CC" style="stroke:#367A49;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="74" y="690.581" fill="#173521" font-size="12" textLength="48" font-family="Microsoft YaHei">工作交接</text><text x="74" y="706.419" fill="#173521" font-size="12" textLength="180" font-family="Microsoft YaHei">后续运行与真实模型验证交由用户</text><rect x="76" y="739.56" width="176" height="51.676" fill="#E9EDF2" style="stroke:#367A49;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="86" y="762.257" fill="#173521" font-size="12" textLength="72" font-family="Microsoft YaHei">真实模型联调</text><text x="86" y="778.095" fill="#173521" font-size="12" textLength="156" font-family="Microsoft YaHei">尚未执行，需配置实际供应商</text><rect x="100" y="811.235" width="128" height="51.676" fill="#E9EDF2" style="stroke:#367A49;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="110" y="833.933" fill="#173521" font-size="12" textLength="84" font-family="Microsoft YaHei">成本与质量评估</text><text x="110" y="849.771" fill="#173521" font-size="12" textLength="108" font-family="Microsoft YaHei">尚未测得真实节省率</text><ellipse cx="164" cy="893.911" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="164" cy="893.911" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="164" y1="74.478" x2="164" y2="94.478" style="stroke:#181818;stroke-width:1;"/><polygon points="160,84.478,164,94.478,168,84.478,164,88.478" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="164" y1="146.153" x2="164" y2="166.153" style="stroke:#181818;stroke-width:1;"/><polygon points="160,156.153,164,166.153,168,156.153,164,160.153" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="164" y1="217.829" x2="164" y2="237.829" style="stroke:#181818;stroke-width:1;"/><polygon points="160,227.829,164,237.829,168,227.829,164,231.829" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="164" y1="289.505" x2="164" y2="309.505" style="stroke:#181818;stroke-width: